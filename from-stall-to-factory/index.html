<header class="top"><div class="topin"><div class="brand" id="brand"></div><div class="valpill" id="val"></div><button class="mute" data-act="mute" id="mutebtn" aria-label="Sound on or off">🔊</button><button class="menu" data-act="menu" aria-label="Menu">☰</button></div><div class="dots" id="dots"></div></header>
<main class="wrap" id="app"></main>

<script>
// From Stall to Factory - Grade 10 IGCSE Business 0264 review, 1.1 to 5.1 (Paper 1 style)
// All businesses, people and figures are fictional and for practice only.

const GLOSSARY = {
  "added value": "The selling price of a product minus the cost of the materials bought in to make it.",
  "opportunity cost": "The next best choice that you give up when you make a decision.",
  "factors of production": "The resources a business needs to make goods or services: land, labour, capital and enterprise.",
  "primary sector": "Businesses that take natural resources from the earth: farming, herding, mining, fishing.",
  "secondary sector": "Businesses that make products from raw materials: factories, food processing, building.",
  "tertiary sector": "Businesses that provide services: shops, banks, transport.",
  "public sector": "Businesses and services owned and run by the government.",
  "private sector": "Businesses owned and run by individuals or companies, not the government.",
  "entrepreneur": "A person who has a business idea and takes the risk of starting it.",
  "business plan": "A document that sets out the business's objectives and how it will reach them: market, finance, people and operations.",
  "sole trader": "A business owned by one person, who has unlimited liability.",
  "partnership": "A business owned by two or more people (usually up to 20), who share the profits and have unlimited liability.",
  "private limited company": "A company owned by shareholders, who have limited liability. Its shares cannot be sold to the public.",
  "unlimited liability": "The owners can lose their own things, like a home, car or savings, to pay the business's debts.",
  "limited liability": "The owners can lose only the money they put into the business.",
  "franchise": "A business (the franchisee) pays to use another business's (the franchisor's) name and way of working.",
  "stakeholder": "Any person or group with an interest in a business, such as workers, customers, banks and the government.",
  "survival": "Staying in business. The most important objective for most new businesses.",
  "job description": "A document that describes the job: title, duties, hours and pay.",
  "person specification": "A document that describes the ideal person for the job: skills, qualifications, experience and qualities.",
  "induction training": "Training on a worker's first days: rules, safety and how the business works.",
  "on-the-job training": "Training at the workplace, by watching and working next to an experienced worker.",
  "off-the-job training": "Training away from the workplace, for example at a college or on a course.",
  "span of control": "The number of workers who report directly to one manager.",
  "chain of command": "The line of authority from the top of the business to the bottom.",
  "delegation": "A manager gives a worker the authority to do a task.",
  "autocratic leadership": "The leader makes all the decisions alone.",
  "democratic leadership": "The leader asks workers for their ideas before deciding.",
  "laissez-faire leadership": "The leader lets workers make most decisions themselves.",
  "jargon": "Special technical words that people outside a job may not understand. A communication barrier.",
  "hygiene factors": "Herzberg: things like pay and working conditions. If they are bad, workers are unhappy, but they do not motivate.",
  "motivators": "Herzberg: things like praise, responsibility and promotion that really motivate workers.",
  "piece rate": "Pay for each unit a worker makes.",
  "time rate": "Pay for each hour a worker works.",
  "job rotation": "Workers move between different tasks to reduce boredom.",
  "job enrichment": "Giving a worker more interesting, more difficult tasks.",
  "market share": "A business's sales as a percentage of the total sales in the market.",
  "mass market": "A very large market where many people buy similar products.",
  "niche market": "A small, special part of a larger market.",
  "market segment": "A group of customers with similar features, such as age, income or lifestyle.",
  "primary research": "New information collected first-hand by the business, such as questionnaires.",
  "secondary research": "Information that already exists, collected by someone else.",
  "sample": "A small group of people who are asked in market research, chosen to represent the whole market.",
  "brand image": "What customers think and feel about a brand.",
  "product life cycle": "The stages a product goes through: introduction, growth, maturity and decline.",
  "extension strategy": "An action to stop sales falling and make a product's life longer.",
  "cost-plus pricing": "The price is the cost per unit plus a percentage mark-up for profit.",
  "penetration pricing": "A low price at the start to win customers and market share quickly.",
  "price skimming": "A high price at the start for a new or unique product.",
  "competitive pricing": "A price close to the prices of competitors.",
  "dynamic pricing": "The price changes often, with demand. For example, higher at busy times.",
  "sales promotion": "Short-term offers to increase sales, such as buy one get one free.",
  "labour productivity": "The output per worker in a period of time. Output ÷ number of workers.",
  "just-in-time": "Inventory arrives just when it is needed, so little stock is held. Part of lean production.",
  "Kaizen": "Continuous improvement: workers suggest many small improvements.",
  "job production": "Making one product at a time, made for one customer.",
  "batch production": "Making a group of identical products, then switching to a different group.",
  "flow production": "Making large numbers of identical products on a continuous line.",
  "automation": "Machines do the work with little or no human control.",
  "fixed costs": "Costs that do not change when output changes, such as rent.",
  "variable costs": "Costs that change directly with output, such as raw materials.",
  "total cost": "Fixed costs + variable costs.",
  "average cost": "Total cost ÷ output. The cost of one unit.",
  "economies of scale": "The average cost per unit falls as a business grows bigger.",
  "diseconomies of scale": "The average cost per unit rises because the business has grown too big.",
  "contribution": "Selling price minus variable cost per unit. It goes toward paying the fixed costs.",
  "break-even": "The output where total revenue equals total cost: no profit, no loss.",
  "margin of safety": "How much actual (or expected) output is above the break-even output.",
  "quality control": "Checking products at the end of production to find faults.",
  "quality assurance": "Checking quality at every stage of production to stop faults happening.",
  "working capital": "The money a business has for its day-to-day running: paying wages and suppliers.",
  "retained profit": "Profit that is kept in the business, not paid to the owners.",
  "overdraft": "The bank lets the business take out more money than it has, up to a limit. Short-term finance.",
  "trade credit": "A supplier lets the business pay later, for example in 30 days.",
  "leasing": "Renting an asset, like a machine, instead of buying it.",
  "share issue": "A company sells new shares to raise money. Only companies can do this.",
  "bank loan": "Money borrowed from a bank, paid back with interest over a fixed time.",
  "crowdfunding": "Raising money from many people, usually online.",
  "non-current assets": "Things a business owns and uses for more than one year, such as machines and buildings."
};

const SEG = {
  mass:    { name: "families (mass market)", short: "family packs", mu: 0.6, price: 16000, demand: 7200 },
  office:  { name: "office workers (quick lunch packs)", short: "office lunch packs", mu: 0.8, price: 18000, demand: 4000 },
  premium: { name: "premium lamb-and-vegetable buyers (niche market)", short: "premium packs", mu: 1.0, price: 20000, demand: 2400 }
};
const MET = { batch: { name: "batch production", fc: 12000000, vc: 10000 }, flow: { name: "flow production", fc: 24000000, vc: 8000 } };
const LOC = { emeelt: "the Emeelt industrial park", bayan: "Bayanzürkh, near Narantuul market", darkhan: "Darkhan city" };
const PAYRATE = { time: 2, piece: 5, bonus: 1 };
const ENT = { sole: "sole trader", partner: "partnership", ltd: "private limited company" };

const T = n => Math.round(n).toLocaleString("en-US") + "₮";
const sg = S => SEG[S.vars.seg || "mass"];
const mt = S => MET[S.vars.method || "batch"];
const contrib = S => sg(S).price - mt(S).vc;
const beQ = S => mt(S).fc / contrib(S);
const mos = S => sg(S).demand - beQ(S);
const profitM = S => (sg(S).demand * contrib(S) - mt(S).fc);
const faults = S => sg(S).demand * PAYRATE[S.vars.pay || "time"] / 100;

// Break-even chart for the player's own figures (SVG, class format: FC, TC, TR lines)
function beChart(S){
  const fc = mt(S).fc, vc = mt(S).vc, p = sg(S).price, be = beQ(S);
  const qmax = Math.ceil(be * 2 / 1000) * 1000, ymax = Math.ceil(p * qmax / 10000000) * 10000000;
  const W = 340, H = 230, L = 52, B = 32, R = 12, Tp = 12, w = W - L - R, h = H - B - Tp;
  const X = q => L + q / qmax * w, Y = v => Tp + h - v / ymax * h;
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = ymax * i / 4; g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2B3B5E"/><text x="${L - 4}" y="${Y(v) + 4}" text-anchor="end" font-size="10" fill="#9AABC9">${v / 1e6}m</text>`; }
  for (let i = 0; i <= 4; i++) { const q = qmax * i / 4; g += `<text x="${X(q)}" y="${H - B + 14}" text-anchor="middle" font-size="10" fill="#9AABC9">${q.toLocaleString("en-US")}</text>`; }
  g += `<text x="${L + w / 2}" y="${H - 2}" text-anchor="middle" font-size="10" fill="#9AABC9">Output (packs per month)</text>`;
  g += `<line x1="${X(0)}" y1="${Y(fc)}" x2="${X(qmax)}" y2="${Y(fc)}" stroke="#F5B841" stroke-width="2" stroke-dasharray="5 4"/>`;
  g += `<line x1="${X(0)}" y1="${Y(fc)}" x2="${X(qmax)}" y2="${Y(fc + vc * qmax)}" stroke="#F87171" stroke-width="2.5"/>`;
  g += `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(qmax)}" y2="${Y(p * qmax)}" stroke="#2DD4BF" stroke-width="2.5"/>`;
  g += `<circle cx="${X(be)}" cy="${Y(p * be)}" r="5" fill="#fff"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:520px;background:#0B1220;border-radius:12px;margin:6px 0" role="img" aria-label="Break-even chart">${g}</svg>
<div class="small">Lines: <span style="color:#F5B841">- - fixed costs</span> · <span style="color:#F87171">total costs</span> · <span style="color:#2DD4BF">total revenue</span> · ⚪ = the break-even point. Money in ₮ (m = million).</div>`;
}

const CMD = {
  "State":     { animal: "🦅 Eagle", means: "say it in clear terms" },
  "Identify":  { animal: "🦉 Owl", means: "name, select or recognise" },
  "Define":    { animal: "🐺 Wolf", means: "give a precise meaning" },
  "Calculate": { animal: "🐫 Camel", means: "work out from the figures" },
  "Outline":   { animal: "🐎 Horse", means: "set out the main points" },
  "Explain":   { animal: "🐂 Yak", means: "say why or how, with evidence" },
  "Consider":  { animal: "🐐 Goat", means: "review the information and respond" },
  "Justify":   { animal: "🐻 Bear", means: "support a decision with evidence or argument" }
};

const GAME = {
  key: "g10-stall-to-factory-v1",
  brand: "🥟 From Stall to Factory <small>· IGCSE Business</small>",
  kicker: "IGCSE Business 0264 · Review 1.1 to 5.1 · Paper 1 style",
  title: "From Stall to<br>Factory",

    { k: "A", t: "Families", d: "Mass market. Big 20-packs, low price, very high sales.", set: { seg: "mass" }, val: 1, out: "👨‍👩‍👧 Huge demand, but strong competition. Your price must be low.", concept: "A [[mass market]] has big sales, but lots of competition and low prices." },

  { id: "c5s7", type: "write", topic: "3.2", exam: true, cmd: "Outline", marks: 4, q: "Outline <b>two</b> disadvantages of primary research for {B}.",

  { id: "c6s2", type: "num", topic: "3.3", exam: true, cmd: "Calculate", marks: 2, unit: "₮", q: S => `Each pack costs {B} 10,000₮ to make. {B} adds a mark-up of <b>${Math.round(sg(S).mu * 100)}%</b>. Calculate the price per pack using [[cost-plus pricing]].`, formula: "Price = cost per unit + (cost per unit × mark-up %)", answer: S => sg(S).price, explain: S => `10,000 + (10,000 × ${Math.round(sg(S).mu * 100)}%) = 10,000 + ${T(10000 * sg(S).mu).replace("₮", "")} = <b>${T(sg(S).price)}</b> per pack. 📌 Remember this price for Chapter 9.` },

{ n: 7, code: "247068", img: "ch7", topic: "4.1-4.2", title: "The Line", sub: "Productivity, lean production, methods and technology", book: SEC[41],
  terms: ["labour productivity", "just-in-time", "Kaizen", "flow production"],
  steps: [
  { id: "c7s1", type: "story", title: "Demand doubles", text: `<p>📈 Supermarkets order more and more. {B} rents a small factory unit.</p><p>⚙️ Now the question is not "can we sell?" but "can we make enough?"</p><p>🧑‍🏫 Mr. Chris: <i>"Productivity is output per worker. It is a number of units, not money."</i></p>` },
  { id: "c7s2", type: "num", topic: "4.1", exam: true, cmd: "Calculate", marks: 2, unit: "packs", q: "Last month, 12 workers made 6,000 packs. Calculate the [[labour productivity]] per worker.", formula: "Labour productivity = output ÷ number of workers", answer: 500, explain: "6,000 ÷ 12 = <b>500 packs per worker</b> per month. ⚠️ Giving the answer as money (500₮) loses a mark." },
  { id: "c7s3", type: "mcq", topic: "4.1", marks: 1, q: "{B} uses [[just-in-time]]: mutton arrives on the day it is needed. Which is a disadvantage?", opts: ["If the supplier is late, production stops", "A lot of money is tied up in stock", "Meat goes bad in the store", "It needs a huge warehouse"], a: 0, explain: "JIT saves storage costs, but depends on reliable suppliers." },
  { id: "c7s4", type: "mcq", topic: "4.1", marks: 1, q: "Why might {B} still hold extra frozen packs before Tsagaan Sar?", opts: ["Demand rises sharply, so stock lets {B} meet every order", "Stock never costs anything", "To make the factory look full", "The law says so"], a: 0, explain: "Businesses hold inventory to meet sudden demand. The cost: money and space tied up." },
  { id: "c7s5", type: "mcq", topic: "4.1", marks: 1, q: "Each week, workers suggest small changes, like moving the flour closer to the folding table. What is this?", opts: ["Kaizen", "Job production", "Automation", "Downsizing"], a: 0, explain: "[[Kaizen]] = continuous improvement through many small steps." },
  { id: "c7s6", type: "choice", title: "Choose your production method", q: S => `You sell to ${sg(S).name}. How will {B} make its packs?`, opts: [
    { k: "A", t: "Batch production", d: "One flavour at a time: mutton, then beef, then vegetable. Flexible.", set: { method: "batch" }, valFn: S => ({ mass: 1, office: 2, premium: 3 })[S.vars.seg || "mass"], outFn: S => `🔁 You can switch flavours easily. Machines stop between batches. Your costs: fixed costs <b>${T(MET.batch.fc)}</b> a month, variable cost <b>${T(MET.batch.vc)}</b> per pack.`, concept: "[[batch production]] is flexible, but time is lost between batches." },
    { k: "B", t: "Flow production", d: "A buuz-forming machine and a nonstop line. Huge output of one standard pack.", set: { method: "flow" }, valFn: S => ({ mass: 3, office: 0, premium: -2 })[S.vars.seg || "mass"], outFn: S => `🏭 The line runs all day. It is expensive to set up but cheap per pack. Your costs: fixed costs <b>${T(MET.flow.fc)}</b> a month, variable cost <b>${T(MET.flow.vc)}</b> per pack.`, concept: "[[flow production]] suits large, steady demand for identical products." }
  ], after: S => `📌 ${S.vars.method === "flow" ? "Flow" : "Batch"} production for ${sg(S).name}. You will use these costs in Chapters 8 and 9.` },
  { id: "c7s7", type: "sort", topic: "4.1", marks: 2, q: "🧰 Job, batch or flow?", cats: ["Job", "Batch", "Flow"], items: [
    ["A wedding cake made for one couple", 0], ["A custom steamer built for one restaurant", 0], ["500 packs of beef buuz, then 500 of mutton", 1], ["A bakery making trays of one bread, then another", 1], ["A line making the same pack nonstop all day", 2]
  ], explain: "[[job production]]: one-off. [[batch production]]: groups. [[flow production]]: continuous." },
  { id: "c7s8", type: "sort", topic: "4.2", marks: 2, q: "🤖 {B} buys a machine that folds buuz ([[automation]]). Who gains, who loses?", cats: ["Business +", "Business −", "Employees +", "Employees −"], items: [
    ["Higher output and fewer mistakes", 0], ["Machines are expensive to buy and repair", 1], ["Fewer boring, repeated tasks", 2], ["Some workers may lose their jobs", 3]
  ], explain: "Technology raises productivity, but costs money and can cause job losses and worry." },
  { id: "c7s9", type: "mcq", topic: "4.2", marks: 1, joe: true, q: "🥔 Joe says: <i>'Contactless card payments at the stall can increase productivity in a service business.'</i>", opts: ["True", "False"], a: 0, explain: "True. Each customer is served faster, so more customers are served per worker." }
  ] },

{ n: 8, code: "863419", img: "ch8", topic: "4.3-4.4", title: "Green and Costs", sub: "Sustainable production, costs and scale", book: SEC[44],
  terms: ["fixed costs", "variable costs", "average cost", "economies of scale"],
  steps: [
  { id: "c8s1", type: "story", title: "Greener, and cheaper?", text: `<p>🌱 Customers ask: <i>"Why so much plastic?"</i> The city wants less waste.</p><p>🏦 The bank asks: <i>"What does each pack really cost you?"</i></p><p>🧑‍🏫 Mr. Chris: <i>"Green and costs go together. Sometimes green saves money. Sometimes it costs more."</i></p>` },
  { id: "c8s2", type: "sort", topic: "4.3", marks: 2, q: "♻️ Which sustainable method is each action?", cats: ["Renewable energy", "Less waste", "Reusing", "Recycling", "Eco-friendly packaging"], items: [
    ["Solar panels on the factory roof", 0], ["Cutting the dough so fewer scraps are thrown away", 1], ["Using the same plastic delivery crates many times", 2], ["Sending used cardboard boxes to a recycling plant", 3], ["Paper trays instead of plastic trays", 4]
  ], explain: "Reusing = using again for the same job. Recycling = turning waste into new material." },
  { id: "c8s3", type: "mcq", topic: "4.3", marks: 1, q: "Which is a disadvantage to {B} of switching to paper trays?", opts: ["They cost more, so profit per pack may fall", "Customers will stop buying", "It is against the law", "Paper trays cannot be frozen"], a: 0, explain: "Sustainable methods can cost more at first. The benefit: a better brand image and less waste." },
  { id: "c8s4", type: "sort", topic: "4.4", marks: 2, q: "💸 Fixed cost or variable cost?", cats: ["Fixed", "Variable"], items: [
    ["Factory rent", 0], ["Manager's salary", 0], ["Insurance", 0], ["Interest on the bank loan", 0], ["Mutton and beef", 1], ["Flour", 1], ["Packaging: trays and boxes", 1]
  ], explain: "[[fixed costs]] stay the same when output changes. [[variable costs]] rise with every pack made." },
  { id: "c8s5", type: "num", topic: "4.4", exam: true, cmd: "Calculate", marks: 2, unit: "₮", table: S => ({ head: ["{B}'s costs", "₮"], rows: [["Fixed costs per month", T(mt(S).fc).replace("₮", "")], ["Variable cost per pack", T(mt(S).vc).replace("₮", "")], ["Output this month", "4,000 packs"]] }), q: "Calculate {B}'s [[total cost]] of making 4,000 packs in a month.", formula: "Total cost = fixed costs + (variable cost per unit × output)", answer: S => mt(S).fc + mt(S).vc * 4000, explain: S => `${T(mt(S).fc)} + (${T(mt(S).vc)} × 4,000) = ${T(mt(S).fc)} + ${T(mt(S).vc * 4000)} = <b>${T(mt(S).fc + mt(S).vc * 4000)}</b>.` },
  { id: "c8s6", type: "num", topic: "4.4", exam: true, cmd: "Calculate", marks: 2, unit: "₮", q: "Calculate the [[average cost]] per pack at 4,000 packs.", formula: "Average cost = total cost ÷ output", answer: S => (mt(S).fc + mt(S).vc * 4000) / 4000, explain: S => `${T(mt(S).fc + mt(S).vc * 4000)} ÷ 4,000 = <b>${T((mt(S).fc + mt(S).vc * 4000) / 4000)}</b> per pack. If your total cost was wrong but your method was right, the own-figure rule still gives you the marks.` },
  { id: "c8s7", type: "mcq", topic: "4.4", marks: 1, table: { head: ["At 8,000 packs a month", "Total cost (₮)", "Average cost (₮)"], rows: [["Batch", "92,000,000", "11,500"], ["Flow", "88,000,000", "11,000"]] }, q: "At 8,000 packs a month, which statement is correct?", opts: ["Flow has the lower average cost, because its high fixed cost is spread over more packs", "Batch is always cheaper", "Average cost does not change with output", "Flow has the higher total cost"], a: 0, explain: "As output grows, fixed costs are spread over more units. This is how big firms gain [[economies of scale]]." },
  { id: "c8s8", type: "sort", topic: "4.4", marks: 2, q: "📉 Which economy of scale is each one?", cats: ["Purchasing", "Marketing", "Financial", "Managerial", "Technical"], items: [
    ["Mutton is cheaper per kg when {B} buys 2 tonnes", 0], ["The advertising cost per pack falls as more packs are sold", 1], ["Banks give {B} a lower interest rate", 2], ["{B} can now employ a specialist accountant", 3], ["A big buuz-forming machine makes each pack cheaper", 4]
  ], explain: "Five economies of scale: purchasing, marketing, financial, managerial, technical." },
  { id: "c8s9", type: "write", topic: "4.4", exam: true, cmd: "Outline", marks: 4, q: "Outline <b>two</b> diseconomies of scale {B} might face as it grows.",
    guide: ["Diseconomy 1 [k] + a fact about {B} [app].", "Diseconomy 2 [k] + a fact about {B} [app]."],
    points: [{ tag: "k", t: "Diseconomy 1 is correct (poor communication; low employee loyalty; weak coordination; lack of control)." }, { tag: "app", t: "It uses a fact about {B} (e.g. three shifts, the factory unit, Bold and Saraa as managers, workers who never meet the owner)." }, { tag: "k", t: "Diseconomy 2 is a different correct point." }, { tag: "app", t: "It uses a fact about {B}." }],
    model: "<p>1. Poor communication [k]: messages must pass from the owner to Bold, then to workers on three different shifts [app].</p><p>2. Low employee loyalty [k]: new factory workers never meet the owner, unlike at the old stall at Narantuul market [app].</p>",
    rules: ["Outline: 1 mark [k] + 1 mark [app] for each diseconomy."] }
  ] },

{ n: 9, code: "571382", img: "ch9", topic: "4.4", title: "Break-even", sub: "Contribution, break-even and margin of safety", book: SEC[44],
  terms: ["contribution", "break-even", "margin of safety", "total cost"],
  steps: [
  { id: "c9s1", type: "story", title: "The bank's big question", text: S => `<p>🏦 The bank asks: <i>"How many packs must {B} sell each month before it makes a profit?"</i></p><div class="data"><div>🏷️ Price per pack: <b>${T(sg(S).price)}</b> (Chapter 6)</div><div>📦 Variable cost per pack: <b>${T(mt(S).vc)}</b> (${mt(S).name})</div><div>🏢 Fixed costs per month: <b>${T(mt(S).fc)}</b></div><div>🛒 Expected sales: <b>${sg(S).demand.toLocaleString("en-US")} packs</b> a month</div></div><p>📓 Copy these four figures into your notebook.</p>` },
  { id: "c9s2", type: "num", topic: "4.4", marks: 2, unit: "₮", q: "Calculate the [[contribution]] per pack.", formula: "Contribution per unit = selling price − variable cost per unit", answer: contrib, explain: S => `${T(sg(S).price)} − ${T(mt(S).vc)} = <b>${T(contrib(S))}</b> per pack.` },
  { id: "c9s3", type: "num", topic: "4.4", exam: true, cmd: "Calculate", marks: 2, unit: "packs", q: "Calculate {B}'s [[break-even]] output per month.", formula: "Break-even output = fixed costs ÷ contribution per unit", answer: beQ, explain: S => `${T(mt(S).fc)} ÷ ${T(contrib(S))} = <b>${beQ(S).toLocaleString("en-US")} packs</b> a month.` },
  { id: "c9s4", type: "mcq", topic: "4.4", marks: 1, figFn: beChart, q: "This is {B}'s break-even chart. At an output of 1,000 packs, does {B} make a profit or a loss?", opts: ["A loss: total costs are above total revenue", "A profit: total revenue is above total costs", "Break-even: no profit and no loss", "You cannot tell from a chart"], a: 0, explain: S => `Left of the break-even point (⚪ at ${beQ(S).toLocaleString("en-US")} packs), the total cost line is above the total revenue line: a loss.` },
  { id: "c9s5", type: "num", topic: "4.4", exam: true, cmd: "Calculate", marks: 2, unit: "packs", q: "Calculate {B}'s [[margin of safety]], using its expected sales.", formula: "Margin of safety = actual (or expected) output − break-even output", answer: mos, explain: S => `${sg(S).demand.toLocaleString("en-US")} − ${beQ(S).toLocaleString("en-US")} = <b>${mos(S).toLocaleString("en-US")} packs</b>. Sales can fall by this much before {B} makes a loss.` },
  { id: "c9s6", type: "sort", topic: "4.4", marks: 2, q: "🔀 What happens to the break-even output?", cats: ["Rises", "Falls"], items: [
    ["The price per pack goes up", 1], ["The factory rent goes up", 0], ["Mutton costs more (variable cost up)", 0], ["{B} cuts its price", 0], ["The fixed costs fall", 1]
  ], explain: "Higher contribution or lower fixed costs → break-even falls. Higher costs or a lower price → break-even rises." },
  { id: "c9s7", type: "mcq", topic: "4.4", marks: 1, q: "Why might break-even analysis give {B} the wrong answer?", opts: ["It assumes every pack made is sold, at the same price", "It cannot use fixed costs", "It only works for services", "It ignores revenue"], a: 0, explain: "Limits: all output is sold; price and variable cost per unit stay the same; costs are not always this simple." }
  ] },

{ n: 11, code: "786024", img: "ch11", topic: "5.1", title: "The Money", sub: "Why businesses need finance, and where it comes from", book: SEC[5],

  steps: [
  { id: "c11s1", type: "story", title: "150 million tögrög", text: S => `<p>🏗️ The new factory at <b>${LOC[S.vars.loc || "emeelt"]}</b> needs <b>150,000,000₮</b> for the building and machines.</p><p>💰 {B} now makes a profit of about <b>${T(profitM(S))}</b> a month (${sg(S).demand.toLocaleString("en-US")} packs × ${T(contrib(S))} contribution − ${T(mt(S).fc)} fixed costs).</p><p>🧑‍🏫 Mr. Chris: <i>"Match the source of finance to the need. Long-term need, long-term source."</i></p>` },
  { id: "c11s2", type: "sort", topic: "5.1", marks: 2, q: "🧾 Why does {B} need the money?", cats: ["Start-up capital", "Expansion", "Replacing non-current assets", "Working capital"], items: [
    ["Money to open the first stall and buy the first steamer", 0], ["Building the new, bigger factory", 1], ["Buying a new freezer when the old one breaks", 2], ["Cash to pay wages and buy mutton every week", 3]

  { id: "c11s3", type: "mcq", topic: "5.1", marks: 1, q: "Why is [[working capital]] so important for {B}?", opts: ["Without it, {B} cannot pay suppliers and wages, even if it makes a profit", "It is the same as profit", "It is only needed by banks", "It pays for the new factory"], a: 0, explain: "A profitable business can still fail if it has no cash to pay its day-to-day bills." },
  { id: "c11s4", type: "sort", topic: "5.1", marks: 2, q: "🏠 Internal or external source of finance?", cats: ["Internal", "External"], items: [

  ], explain: "Internal = from inside the business or its owners. External = from outside the business." },
  { id: "c11s5", type: "sort", topic: "5.1", marks: 2, q: "⏳ Short-term or long-term finance?", cats: ["Short-term", "Long-term"], items: [

  { id: "c11s6", type: "mcq", topic: "5.1", marks: 1, q: S => `{B} makes about ${T(profitM(S))} a month. Why might [[retained profit]] alone be a weak choice for the 150,000,000₮ factory?`, opts: S => [`It would take about ${Math.ceil(150000000 / profitM(S))} months to save it, and the factory is needed now`, "Retained profit has high interest", "Retained profit is an external source", "Banks do not allow it"], a: 0, explain: "Retained profit has no interest and no new owners, but there may not be enough of it, soon enough." },

    { k: "B", t: "Issue new shares to private investors", d: "Long-term. No interest. New owners share the profit.", set: { fin: "shares" }, val: 3, lock: S => S.vars.entity !== "ltd" ? `🔒 Only companies can issue shares. A ${ENT[S.vars.entity || "sole"]} cannot.` : "", out: "📈 Two investors buy shares. No interest to pay, but you now share control and dividends.", concept: "A [[share issue]] brings in permanent capital, but dilutes ownership and control." },

{ n: 12, code: "430598", img: "ch12", topic: "Final", title: "The Exam Room", sub: "One full 8-mark (d) question", book: SEC[5],
  terms: ["bank loan", "share issue", "leasing", "retained profit"],
  steps: [
  { id: "c12s1", type: "story", title: "From stall to factory", text: S => `<p>🎉 The new {B} factory opens at <b>${LOC[S.vars.loc || "emeelt"]}</b>. You started with one steamer at Narantuul market.</p><p>📦 ${mt(S).name[0].toUpperCase() + mt(S).name.slice(1)} for ${sg(S).name}. Break-even: ${beQ(S).toLocaleString("en-US")} packs. Margin of safety: ${mos(S).toLocaleString("en-US")} packs.</p><p>🧑‍🏫 Mr. Chris: <i>"One last test. The (d) question is worth 8 marks. Two sides, then a decision with a NEW reason."</i></p>` },
  { id: "c12s2", type: "write", topic: "Final", exam: true, cmd: "Justify", marks: 8, q: "{B} needs 150,000,000₮ for its new factory. Explain <b>two</b> sources of finance {B} could use. Which source should {B} choose? <b>Justify</b> your answer.",
    guide: ["Source 1: name it [k] + a fact about {B} [app] + so... [an].", "Source 2: the same three moves.", "Decision: which one, and WHY it is better than the other one [eval]. Do not just repeat."],
    points: [
      { tag: "k", t: "Source 1 is named and correct, with what it means (e.g. bank loan: borrowed and paid back with interest)." },
      { tag: "k", t: "Source 2 is a different correct source." },
      { tag: "app", t: "Source 1 uses a fact about {B} (the 150,000,000₮, its legal form, its monthly profit, the new factory)." },
      { tag: "app", t: "Source 2 uses a fact about {B}." },
      { tag: "an", t: "Source 1 has a consequence: 'so...' or 'which means...'." },
      { tag: "an", t: "Source 2 has a consequence." },
      { tag: "eval", t: "A clear decision: which source {B} should choose." },
      { tag: "eval", t: "The decision is justified with a comparing reason that is NEW, not a repeat of earlier points." }
    ],
    model: S => {
      const e = S.vars.entity || "sole", p = T(profitM(S)), months = Math.ceil(150000000 / profitM(S));
      const s2 = e === "ltd"
        ? `<p><b>Source 2: share issue.</b> {B} is a private limited company, so it can sell new shares to private investors [k]. It could sell shares worth 150,000,000₮ to people its owners know [app]. This means no interest to pay, but the new shareholders own part of {B}, so they share the profit and control [an].</p>`
        : `<p><b>Source 2: retained profit.</b> This is profit kept in the business, so there is no interest [k]. {B} makes about ${p} a month [app]. But it would take about ${months} months to save 150,000,000₮, which means the factory opens late and rivals may win customers first [an].</p>`;
      const dec = e === "ltd"
        ? `<p><b>Decision:</b> {B} should choose the share issue [eval]. The factory is a long-term asset, and shares never need to be paid back. With fixed costs already at ${T(mt(S).fc)} a month, adding loan repayments would push break-even output up, while new shareholders only take dividends when there is profit [eval].</p>`
        : `<p><b>Decision:</b> {B} should choose the bank loan [eval]. It is the only source that gives the full 150,000,000₮ now, and the interest can be paid from a monthly profit of about ${p}. This is better than waiting ${months} months, because the factory can start earning straight away. If sales fall, though, the repayments are a risk [eval].</p>`;
      return `<p><b>Source 1: bank loan.</b> Money borrowed from a bank and paid back with interest over several years [k]. {B} needs 150,000,000₮ for a long-term asset, its new factory [app]. This means {B} keeps full ownership, but interest raises its costs every month, so profit falls [an].</p>` + s2 + dec;
    },
    rules: ["(d) questions: up to 2 marks each for [k], [app], [an] and [eval].", "Only the first two sources count.", "No mirror credit: 'a loan has interest' and 'shares have no interest' is one point, not two.", "The justification must add something new. Repeating earlier points earns no [eval] marks.", "Any sensible decision can earn full marks if it is justified. The model chooses one; yours may differ."] },
  { id: "c12s3", type: "story", title: "Show Mr. Chris", text: `<p>📓 Keep your notebook open at your 8-mark answer.</p><p>🧑‍🏫 Mr. Chris may check that your marks match your writing. Be honest: a Cambridge examiner will not be generous.</p><p>👉 Tap <b>Continue</b> to see your Founder's Report.</p>` }
  ] }
];

<script>
const KEY = GAME.key;
const MASTER = GAME.master;
let S = load() || fresh();
let ui = {};
let AC = null;
function tone(freqs, dur, type, vol){ if (S.mute) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const t0 = AC.currentTime; freqs.forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type || "sine"; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t0 + i * dur); g.gain.exponentialRampToValueAtTime(vol || 0.07, t0 + i * dur + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + (i + 1) * dur + 0.15); o.connect(g); g.connect(AC.destination); o.start(t0 + i * dur); o.stop(t0 + (i + 1) * dur + 0.2); }); } catch (e) {} }
const ding = () => tone([880, 1320], 0.09, "sine", 0.06), thud = () => tone([196], 0.14, "triangle", 0.05), fanfare = () => tone([523, 659, 784, 1047], 0.1, "sine", 0.05);
function fresh(){ return { name:"", val:10, ch:0, step:0, screen:"start", unlocked:{}, vars:{}, res:{}, master:false, mute:false }; }
function load(){ try{ const t = localStorage.getItem(KEY); return t ? JSON.parse(t) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const $ = id => document.getElementById(id);
const fmt = n => { const r = Math.round(n*10)/10; return r.toLocaleString("en-US"); };
const money = n => "MNT " + Math.round(n).toLocaleString("en-US");
function val(x){ return typeof x === "function" ? x(S) : x; }
function esc(t){ return String(t).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function sub(t){ return String(t).replace(/\{B\}/g, esc(S.vars.brand || "your business")).replace(/\{N\}/g, esc(S.name || "Founder")); }
function gl(html){
  return sub(html).replace(/\[\[([^\]]+)\]\]/g, (m, w) => {
    const [term, label] = w.split("|");
    const k = Object.keys(GLOSSARY).find(g => g.toLowerCase() === term.toLowerCase());
    return k ? `<span class="term" data-act="term" data-term="${k}">${label || term}</span>` : (label || term);
  }).replace(/\[(k|app|an|eval)\]/g, (m, t) => `<span class="tag ${t}">${t}</span>`);
}
function rng(seed){ let h = 2166136261; for (const c of seed) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; }; }
function shuffled(arr, seed){ const r = rng(seed); const idx = arr.map((_, i) => i); for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; } return idx; }
function parseNum(t){ if (t == null) return NaN; t = String(t).trim().toLowerCase().replace(/₮|tugrik|tögrög|mnt|packs?|points?|units?|,|%|\s/g, ""); let mult = 1; if (/(billion|bn)$/.test(t)) { mult = 1e9; t = t.replace(/(billion|bn)$/, ""); } else if (/(million|m)$/.test(t)) { mult = 1e6; t = t.replace(/(million|m)$/, ""); } return parseFloat(t) * mult; }
function close(x, ans){ if (isNaN(x)) return false; const tol = Math.max(Math.abs(ans) * 0.005, 0.01); return [1, 1e6, 1e9].some(k => Math.abs(x * k - ans) <= tol); }

function ch(){ return CHAPTERS[S.ch]; }
function step(){ return ch().steps[S.step]; }
function addVal(d){ S.val = Math.round((S.val + d) * 10) / 10; }
function record(st, earned, extra){ S.res[st.id] = Object.assign({ done:true, earned, max: st.marks || 0, topic: st.topic, ch: S.ch }, extra || {}); addVal(earned); save(); render(); }

function header(){
  $("brand").innerHTML = GAME.brand;
  $("val").textContent = "🥟 " + fmt(S.val) + "M₮"; $("mutebtn").textContent = S.mute ? "🔇" : "🔊";
  $("dots").innerHTML = CHAPTERS.map((c, i) => `<i class="${i < S.ch || (S.screen === "report") ? "done" : i === S.ch && S.screen !== "start" ? "cur" : ""}"></i>`).join("");
}
function chips(st){
  let h = `<div class="chips"><span class="chip topic">${st.topic === "Final" ? (GAME.finalLabel || "Paper 1") : st.topic}</span>`;
  if (st.exam && st.cmd) h += `<span class="chip exam">📝 Exam part</span><span class="chip animal">${CMD[st.cmd].animal} · ${st.cmd} · [${st.marks}]</span>`;
  else h += `<span class="chip">Quick check · ${st.marks} pt${st.marks === 1 ? "" : "s"}</span>`;
  if (st.joe) h += `<span class="chip joe">🥔 Joe says</span>`;
  let x = h + "</div>";
  if (st.exam && st.cmd) x += `<p class="small" style="margin:-4px 0 8px">${st.cmd} = ${CMD[st.cmd].means}.</p>`;
  return x;
}
function heroFor(c){
  const im = IMG[c.img];
  return `<div class="hero">${im ? `<img src="${im}" alt="">` : ""}<div class="cap"><div class="chn">${c.n === CHAPTERS.length ? "Finale" : (GAME.chapterWord || "Chapter") + " " + c.n} · ${c.topic === "Final" ? (GAME.finalLabel || "Paper 1") : c.topic}</div><h1>${c.title}</h1><div class="sub">${c.sub}</div></div></div>${CREDITS[c.img] ? `<div class="credit">Photo: ${CREDITS[c.img]}</div>` : ""}${c.book ? `<div class="book">${c.book}</div>` : ""}`;
}
function nextBtn(label){ return `<div class="row"><button class="btn" data-act="next">${label || "Continue →"}</button></div>`; }

let lastKey = "";
function render(){
  header();
  const app = $("app");
  const key = S.screen + "|" + S.ch + "|" + S.step;
  if (key !== lastKey) { lastKey = key; app.classList.add("anim"); window.scrollTo(0, 0); } else app.classList.remove("anim");
  if (S.screen === "start") return app.innerHTML = startScreen();
  if (S.screen === "gate") return app.innerHTML = gateScreen();
  if (S.screen === "end") return app.innerHTML = endScreen();
  if (S.screen === "report") return app.innerHTML = reportScreen();
  const c = ch(), st = step();
  app.innerHTML = heroFor(c) + renderStep(st);

  if (a === "popclose") { $("pop").innerHTML = ""; return; }
  if (a === "reset") {
    if (!ui.confirmReset) { ui.confirmReset = true; b.textContent = "Tap again to erase my progress"; return; }
    S = fresh(); ui = {}; save(); $("pop").innerHTML = ""; return render();
  }
  if (a === "startgo") { S.name = ($("nm").value || "").trim().slice(0, 24); S.screen = "gate"; S.ch = 0; save(); return render(); }
  if (a === "code") {
    const v = ($("code").value || "").trim().toUpperCase();
    if (v === MASTER) S.master = true;
    if (v === ch().code || v === MASTER) { S.unlocked[S.ch] = true; S.screen = "play"; S.step = 0; ui = {}; save(); return render(); }
    ui.codeErr = true; return render();
  }
  if (a === "next") { ui = {}; let n = S.step + 1; while (n < ch().steps.length && ch().steps[n].show && !ch().steps[n].show(S)) n++; if (n < ch().steps.length) S.step = n; else S.screen = "end"; save(); return render(); }
  if (a === "tonext") {
    ui = {};
    if (S.ch === CHAPTERS.length - 1) { S.screen = "report"; save(); return render(); }
    S.ch++; S.step = 0; S.screen = (S.master || S.unlocked[S.ch]) ? "play" : "gate"; save(); return render();
  }
  if (a === "flip") { ui.flip = ui.flip || {}; ui.flip[b.dataset.i] = !ui.flip[b.dataset.i]; return render(); }
  if (!st) return;
  if (a === "choose" && !S.res[st.id]) {
    const i = +b.dataset.i, o = st.opts[i];
    if (o.lock && o.lock(S)) return;
    Object.assign(S.vars, o.set || {});
    const d = o.valFn ? o.valFn(S) : o.val;
    const after = st.after ? st.after(S) : "";
    S.res[st.id] = { done: true, pick: i, delta: d, after, ch: S.ch, max: 0, earned: 0 };
    addVal(d); save(); return render();
  }
  if (a === "mcq") {
    const i = +b.dataset.i; ui.tries = ui.tries || [];
    if (ui.tries.includes(i)) return;
    ui.tries.push(i);
    if (i === st.a) { ding(); return record(st, ui.tries.length === 1 ? st.marks : st.marks / 2, { tries: ui.tries }); }
    thud();
    if (ui.tries.length >= 2 || val(st.opts).length === 2) return record(st, 0, { tries: ui.tries });
    return render();
  }
  if (a === "sortpick") { ui.pick = ui.pick || {}; ui.pick[b.dataset.i] = +b.dataset.c; return render(); }
  if (a === "sortcheck") {
    const right = st.items.filter((it, i) => ui.pick[i] === it[1]).length;
    (right === st.items.length ? ding : right ? () => {} : thud)();
    return record(st, Math.round(st.marks * right / st.items.length * 2) / 2, { pick: ui.pick, right });
  }
  if (a === "numcheck") {
    const raw = $("ans").value; const x = parseNum(raw); ui.tries = ui.tries || [];
    if (raw.trim() === "") return;
    ui.tries.push(raw);
    if (close(x, val(st.answer))) { ding(); return record(st, ui.tries.length === 1 ? st.marks : st.marks / 2, { tries: ui.tries }); }
    thud();
    if (ui.tries.length >= 2) return record(st, 0, { tries: ui.tries });
    return render();
  }
  if (a === "buildpick") { ui.pick = ui.pick || {}; ui.pick[b.dataset.s] = +b.dataset.o; return render(); }
  if (a === "buildcheck") { const sl = val(st.slots); const right = sl.filter((_, i) => ui.pick[i] === 0).length; (right === sl.length ? ding : () => {})(); return record(st, right * st.marks / sl.length, { pick: ui.pick, right }); }
  if (a === "orderpick") { ui.seq = ui.seq || []; ui.seq.push(+b.dataset.i); return render(); }
  if (a === "orderundo") { ui.seq.pop(); return render(); }
  if (a === "ordercheck") { const right = ui.seq.filter((x, p) => x === p).length; if (right === st.items.length) ding(); return record(st, Math.round(st.marks * right / st.items.length * 2) / 2, { seq: ui.seq, right }); }
  if (a === "stmtcheck") {
    const rows = val(st.rows); const ans = {}, ok = {}; let n = 0, right = 0;
    document.querySelectorAll("input[data-row]").forEach(inp => {
      const i = +inp.dataset.row; ans[i] = inp.value; n++;
      const x = parseNum(inp.value), want = Math.abs(rows[i][2]);
      ok[i] = !isNaN(x) && Math.abs(Math.abs(x) - want) <= 0.051; if (ok[i]) right++;
    });
    return record(st, Math.round(st.marks * right / n * 2) / 2, { ans, ok, right, n });
  }
  if (a === "nbreveal") { ui.reveal = true; return render(); }
  if (a === "nbpick") { ui.nb = +b.dataset.n; return render(); }
  if (a === "nbsave") return record(st, ui.nb, {});
  if (a === "lvl") { ui.lvl = +b.dataset.i; return render(); }
  if (a === "tick") { ui.ticks = ui.ticks || {}; ui.ticks[b.dataset.i] = b.checked; return render(); }
  if (a === "wsave") { const m = st.levels ? st.levels[ui.lvl][0] : st.points.filter((_, i) => (ui.ticks || {})[i]).length; return record(st, m, st.levels ? { lvl: ui.lvl } : { ticks: ui.ticks || {} }); }
});
document.addEventListener("keydown", e => { if (S.screen === "gate" && /^[0-9]$|^Backspace$|^Enter$/.test(e.key)) { const k = e.key === "Backspace" ? "⌫" : e.key === "Enter" ? "✓" : e.key; const btn = document.querySelector(`[data-act="key"][data-k="${k}"]`); if (btn) btn.click(); return; } if (e.key === "Enter") { const c = document.querySelector('[data-act="numcheck"]'); if (c && document.activeElement && document.activeElement.tagName === "INPUT") c.click(); } });
render();
</script>
