  { id: "c4s5", type: "mcq", topic: "4.5", marks: 1, joe: true, q: "🥔 Joe says: <i>'Quality assurance means hiring more inspectors for the end of the line.'</i>", opts: ["True", "False"], a: 1, explain: "False. That is more quality control. Quality assurance makes <b>every</b> worker and supplier responsible, at every stage." }

  { id: "c5s2", type: "num", topic: "4.6", marks: 2, unit: "₮", q: "Add land rent and transport costs for each location. How much does UP save each month in Nalaikh, compared with Khan-Uul?", formula: "Saving = (rent + transport in Khan-Uul) − (rent + transport in Nalaikh)", answer: 5000000, explain: "Khan-Uul: 15,000,000 + 1,000,000 = 16,000,000₮. Nalaikh: 5,000,000 + 6,000,000 = 11,000,000₮. Saving = <b>5,000,000₮</b> a month." },
  { id: "c5s3", type: "mcq", topic: "1.3", marks: 1, q: "Why would the government offer UP a grant of 50,000,000₮ to build in Nalaikh?", opts: ["To create jobs in an area that needs them", "To reduce UP's sales", "Because grants must be repaid with interest", "To help UP's rivals"], a: 0, explain: "Governments support businesses to create jobs and growth. A grant does not have to be repaid." },
  { id: "c5s4", type: "mcq", topic: "4.6", marks: 1, q: "Why does 'skilled workers nearby' matter so much for UP?", opts: ["Sewing bags needs skill, and UP already has quality and productivity problems", "Skilled workers accept lower pay", "Skilled workers do not need managers", "It does not matter for a factory"], a: 0, explain: "Labour is a key location factor for a manufacturer. With few skilled workers, UP must recruit and train, which takes time and money." },
  { id: "c5s5", type: "build", topic: "4.6", exam: true, cmd: "Consider", part: "Question 2(b) · step 1 of 2", label: "discuss · 6 of the 12", marks: 6, group: 3, tags: null, plainJoin: true, heads: ["Nalaikh", "Khan-Uul"],

    slots: [

      { label: "⚠️ A point against", opts: ["Few skilled sewing workers live nearby, and UP's 40 employees may not want to travel 35 km, so UP may have to recruit and train new workers", "It is far", "Nalaikh has many skilled sewing workers, so wages are high"] },
      { label: "🔢 The numbers", opts: ["Rent + transport = 5,000,000₮ + 6,000,000₮ = 11,000,000₮ a month: the cheaper location", "It costs less", "Rent + transport = 5,000,000₮ + 1,000,000₮ = 6,000,000₮ a month"] },

  { id: "c5s7", type: "write", topic: "4.6", exam: true, cmd: "Justify", part: "Question 2(b) · step 2 of 2", label: "decide · 6 of the 12", marks: 6, q: "Which location should UP choose? Justify your answer using Appendix 3.", task: "Write your recommendation in your notebook: 4 to 6 sentences.",
    guide: ["State your choice.", "Give your main reason. Use a calculation from Appendix 3.", "Explain why the other location is worse for UP.", "Finish with a condition: 'This will only work if...'"], frame: ["UP should choose ... because ...", "Appendix 3 shows that ..., so ...", "The other location is worse because ...", "However, this will only work if ..."],
    points: TICKS("I used a calculation from Appendix 3, not just copied figures.", "I explained why the other location is worse for UP."), modelTitle: "Model recommendation for your choice",
    model: S => ({

    })[S.vars.q2 || "khan"], rules: RULES_C }

{ n: 6, code: "924301", img: "breakeven", topic: "4.4", title: "Question 3(a)", sub: "Two calculations and four quick answers", book: "📖 Coursebook pp. 292-311",
  terms: ["contribution", "break-even", "average cost", "economies of scale"],
  steps: [
  { id: "c6s1", type: "story", chip: "Question 3(a) · 8 marks", title: "The question", text: `<p class="q">(i) Calculate UP's break-even output per month. <b>[2]</b></p><p class="q">(ii) Calculate UP's average cost per bag at an output of 6,000 bags. <b>[2]</b></p><p class="q">(iii) State <b>four</b> economies of scale. <b>[4]</b></p>` + APP1 + `<p>🐫 <b>Calculate:</b> show your working. A correct method can earn 1 mark.</p><p>🦅 <b>State:</b> short answers. No explanation needed.</p>` },
  { id: "c6s2", type: "sort", topic: "4.4", marks: 2, q: "💸 Fixed cost or variable cost for UP?", cats: ["Fixed cost", "Variable cost"], items: [["Factory rent", 0], ["The inspectors' salaries", 0], ["Insurance", 0], ["Fabric", 1], ["Zips and buckles", 1], ["Packaging for each bag", 1]], explain: "[[fixed costs]] stay the same when output changes. [[variable costs]] rise with every extra bag." },
  { id: "c6s3", type: "num", topic: "4.4", marks: 2, unit: "₮", q: "A bag sells for 65,000₮. The variable cost is 35,000₮ per bag. Calculate the [[contribution]] per bag.", formula: "Contribution per unit = price − variable cost per unit", answer: 30000, explain: "65,000 − 35,000 = <b>30,000₮</b>. Each bag gives 30,000₮ toward the fixed costs." },
  { id: "c6s4", type: "num", topic: "4.4", exam: true, cmd: "Calculate", part: "Question 3(a)(i)", marks: 2, unit: "bags", q: "Fixed costs are 150,000,000₮ a month. The contribution is 30,000₮ per bag. Calculate UP's [[break-even]] output per month.", formula: "Break-even output = fixed costs ÷ contribution per unit", answer: 5000, explain: "150,000,000 ÷ 30,000 = <b>5,000 bags</b>. UP sells 6,000, so its [[margin of safety]] is 1,000 bags." },
  { id: "c6s5", type: "num", topic: "4.4", exam: true, cmd: "Calculate", part: "Question 3(a)(ii)", marks: 2, unit: "₮", q: "Calculate UP's [[average cost]] per bag at an output of 6,000 bags.", formula: "Average cost = total cost ÷ output · Total cost = fixed costs + (variable cost per unit × output)", answer: 60000, explain: "Total cost = 150,000,000 + (35,000 × 6,000) = 360,000,000₮. Average cost = 360,000,000 ÷ 6,000 = <b>60,000₮</b> per bag." },
  { id: "c6s6", type: "write", topic: "4.4", exam: true, cmd: "State", part: "Question 3(a)(iii)", marks: 4, q: "State <b>four</b> economies of scale.", task: "Write four short answers in your notebook.",

    points: [{ t: "My 1st answer is on the list." }, { t: "My 2nd answer is on the list, and it is different." }, { t: "My 3rd answer is on the list, and it is different." }, { t: "My 4th answer is on the list, and it is different." }],
    modelTitle: "Accepted answers (any four)", model: "<p>Purchasing (bulk-buying) · Marketing · Financial · Managerial · Technical</p><p class=\"small\">Example for UP: buying fabric for 8,000 bags, not 6,000, may bring a lower price per meter: a purchasing economy.</p>",
    rules: ["State: 1 mark for each correct economy of scale, up to 4 marks.", "Two answers that mean the same thing earn 1 mark only.", "Only your first four answers count."] }
  ] },

{ n: 7, code: "587416", img: "shop", topic: "4.4", title: "Question 3(b)", sub: "The MegaShop order: yes or no?", book: "📖 Coursebook pp. 292-311 and pp. 212-243",
  terms: ["contribution", "average cost", "brand image", "market segment"],
  steps: [
  { id: "c7s1", type: "story", chip: "Question 3(b) · 12 marks", title: "The question", text: `<p class="q">MegaShop wants to buy 2,000 bags a month from UP for 50,000₮ each. Should UP accept this order? Justify your answer using suitable calculations. <b>[12]</b></p>` + APP2 + `<p>🐫 'Using suitable calculations' means: no numbers, no top level.</p>` },
  { id: "c7s2", type: "num", topic: "4.4", marks: 2, unit: "₮", q: "Calculate the extra revenue per month from the MegaShop order.", formula: "Extra revenue = extra bags × price paid by MegaShop", answer: 100000000, explain: "2,000 × 50,000 = <b>100,000,000₮</b> a month." },
  { id: "c7s3", type: "num", topic: "4.4", exam: true, cmd: "Calculate", part: "Question 3(b) · step 1 of 3", label: "calculate · 2 of the 12", marks: 2, unit: "₮", q: "Calculate the extra profit per month if UP accepts the MegaShop order.", formula: "Extra profit = extra revenue − extra variable costs − extra fixed costs", answer: 14000000, explain: "Extra variable costs = 2,000 × 38,000 = 76,000,000₮. Extra profit = 100,000,000 − 76,000,000 − 10,000,000 = <b>14,000,000₮</b> a month." },
  { id: "c7s4", type: "mcq", topic: "3.3", marks: 1, q: "MegaShop will sell the same bag, under its own name, for less than the 65,000₮ 'Uul' bag. What is the marketing risk for UP?", opts: ["Some customers may buy the cheaper MegaShop bag and stop buying 'Uul' bags", "MegaShop will pay UP too much", "UP's fixed costs will fall", "The 'Uul' brand will become too famous"], a: 0, explain: "UP earns a [[contribution]] of 30,000₮ on an 'Uul' bag, but only 12,000₮ (50,000 − 38,000) on a MegaShop bag. Losing 'Uul' sales is expensive." },
  { id: "c7s5", type: "mcq", topic: "3.1", marks: 1, q: "MegaShop's customers look for low prices. 'Uul' customers pay more for a brand they trust. What are these two groups?", opts: ["Different market segments", "Different economic sectors", "Internal stakeholders", "Two types of sample"], a: 0, explain: "A [[market segment]] is a group of customers with similar needs. One product at two prices can serve two segments, if they stay separate." },
  { id: "c7s6", type: "build", topic: "4.4", exam: true, cmd: "Consider", part: "Question 3(b) · step 2 of 3", label: "discuss · 4 of the 12", marks: 4, group: 2, tags: null, plainJoin: true, heads: ["Accept the order", "Reject the order"],
    q: "Consider both sides of the MegaShop decision.", intro: "Two reasons to accept, two reasons to reject. Choose the piece that uses the case correctly.",
    slots: [
      { label: "✅ Reason to accept: the numbers", opts: ["The order adds 14,000,000₮ profit a month: 100,000,000₮ revenue − 76,000,000₮ variable costs − 10,000,000₮ fixed costs", "The order makes money", "The order adds 100,000,000₮ profit a month, because revenue is profit"] },
      { label: "✅ Reason to accept: scale", opts: ["Buying fabric and zips for 8,000 bags, not 6,000, may bring purchasing economies of scale", "Bigger is better", "Making more bags always causes diseconomies of scale"] },
      { label: "⚠️ Reason to reject: marketing", opts: ["MegaShop sells the same bag for less, so some customers may stop buying 'Uul' bags at 65,000₮", "MegaShop is a shop", "50,000₮ is below the average cost of 60,000₮, so UP loses 10,000₮ on every MegaShop bag"] },
      { label: "⚠️ Reason to reject: operations", opts: ["The factory can make only 6,500 bags, so a night shift is needed: tired workers may make more faulty bags than the 4% returned now", "Night is dark", "The factory can make 20,000 bags a month, so there is no problem"] }
    ], explain: "⚠️ The trap: '50,000₮ is below the average cost of 60,000₮, so UP makes a loss'. Wrong! The normal fixed costs are already covered by the 6,000 'Uul' bags. Only the <b>extra</b> costs matter: 38,000₮ per bag + 10,000,000₮.", copy: "Copy the calculation and one reason for each side into your notebook." },
  { id: "c7s7", type: "choice", chip: "Your advice", title: "What do you tell Bat and Oyun?", q: "Should UP accept the MegaShop order?", conceptLabel: "Examiner's view:", opts: [
    { k: "A", t: "Accept the order", d: "+14,000,000₮ a month. Risk to the brand.", set: { q3: "yes" }, val: 1, out: "✅ The night shift starts. Profit rises. Three months later, a shop owner calls: 'Why is the same bag cheaper at MegaShop?'", concept: SAME },
    { k: "B", t: "Reject the order", d: "Protect the brand. Lose the extra profit.", set: { q3: "no" }, val: 1, out: "⛔ UP says no. The 'Uul' brand stays special. MegaShop signs with UP's rival, which now makes even more bags.", concept: SAME }
  ] },
  { id: "c7s8", type: "write", topic: "4.4", exam: true, cmd: "Justify", part: "Question 3(b) · step 3 of 3", label: "decide · 6 of the 12", marks: 6, q: "Should UP accept the MegaShop order? Justify your answer using suitable calculations.", task: "Write your recommendation in your notebook: 4 to 6 sentences.",
    guide: ["State your decision: accept or reject.", "Show the calculation of the extra profit.", "Explain the strongest reason on the other side, and why it does not change your decision.", "Finish with a condition: 'This will only work if...'"], frame: ["UP should ... the order because ...", "Extra profit = ... − ... − ... = ...", "The other side is that ... However, ...", "This will only work if ..."],
    points: TICKS("My answer shows a calculation (for example the 14,000,000₮ extra profit).", "I explained the other side and why it does not change my decision."), modelTitle: "Model recommendation for your choice",
    model: S => ({
      yes: "<p>UP should accept the order. Extra revenue is 2,000 × 50,000₮ = 100,000,000₮. Extra costs are 76,000,000₮ of variable costs plus 10,000,000₮ of fixed costs, so profit rises by 14,000,000₮ a month. UP's profit is now 30,000,000₮ a month, so this is a rise of almost 50%, and it could help to pay for the new factory.</p><p>The price of 50,000₮ is below the average cost of 60,000₮, but this does not matter: the normal fixed costs are already covered by the 6,000 'Uul' bags. The risk is that customers switch to the cheaper MegaShop bag.</p><p>So this will only work if the MegaShop bag looks different from the 'Uul' bag, and if quality stays high on the night shift.</p>",
      no: "<p>UP should reject the order. The order adds 14,000,000₮ profit a month (100,000,000₮ − 76,000,000₮ − 10,000,000₮), but the risk is bigger. MegaShop would sell the same bag for less than 65,000₮, so some customers would stop buying 'Uul' bags.</p><p>UP earns a contribution of 30,000₮ on each 'Uul' bag, but only 12,000₮ on each MegaShop bag. If UP loses just 500 'Uul' sales a month, it loses 15,000,000₮: more than the order earns. A night shift could also mean more than 4% of bags returned.</p><p>However, UP could say yes later, when the new factory is ready and the MegaShop bag can be a different design.</p>"
    })[S.vars.q3 || "yes"], rules: RULES_C }
  ] },

{ n: 8, code: "362058", img: "fabric", topic: "4.3", title: "Question 4(a)", sub: "Your turn to write: recycled fabric", book: "📖 Coursebook pp. 292-311",
  terms: ["sustainable production", "variable costs", "contribution", "brand image"],
  steps: [
  { id: "c8s1", type: "story", chip: "Question 4(a) · 8 marks", title: "The question", text: `<p class="q">Explain <b>one</b> advantage and <b>one</b> disadvantage to UP of using recycled fabric to make its bags. <b>[8]</b></p><p>✍️ This time, <b>you</b> write the answer.</p><div class="data"><div>✅ 1 mark for the advantage, 1 mark for the disadvantage [k]</div><div>✅ Up to 3 marks for explaining each one</div><div>📄 Use the case at least once in each [app]</div></div><p>📄 From the case: fabric costs 20,000₮ per bag. Recycled fabric, made from plastic bottles, costs 10% more.</p>` },
  { id: "c8s2", type: "sort", topic: "4.3", marks: 2, q: "♻️ Which sustainable method is each action?", cats: ["Less waste", "Reusing", "Recycling"], items: [["Cutting fabric by computer so that fewer scraps are thrown away", 0], ["Ordering only the fabric needed for each batch", 0], ["Using the same delivery boxes many times", 1], ["Fabric made from old plastic bottles", 2], ["Sending fabric scraps to a firm that turns them into filling", 2]], explain: "[[sustainable production]] uses fewer resources and does less harm: less waste, reusing and recycling. Renewable energy and eco-friendly packaging are two more methods." },
  { id: "c8s3", type: "num", topic: "4.3", marks: 2, unit: "₮", q: "Fabric costs UP 20,000₮ per bag. Recycled fabric costs 10% more. Calculate the extra cost per bag.", formula: "Extra cost = cost of fabric × 10%", answer: 2000, explain: "20,000 × 10% = <b>2,000₮</b> per bag. The variable cost rises from 35,000₮ to 37,000₮, so the contribution falls from 30,000₮ to 28,000₮." },
  { id: "c8s4", type: "write", topic: "4.3", exam: true, cmd: "Explain", part: "Question 4(a)", marks: 8, q: "Explain <b>one</b> advantage and <b>one</b> disadvantage to UP of using recycled fabric to make its bags.", task: "Write your full answer in your notebook: about 6 sentences.",
    guide: ["Advantage: name it [k]. Use the case [app]. Then 'so...' and 'so...' [an].", "Disadvantage: the same four moves.", "ONE advantage and ONE disadvantage only. Depth, not a list."],
    frame: ["One advantage is ...", "In the case, ..., so ...", "This means ...", "One disadvantage is ...", "In the case, ..., so ...", "This means ..."],
    points: [
      { tag: "k", t: "My advantage is correct (e.g. better brand image; attracts customers who care about the environment; less waste; a reason to charge a higher price)." },
      { tag: "app", t: "It uses the case (fabric made from plastic bottles; hiking backpacks; the 'Uul' brand; MegaShop and other shops)." },
      { tag: "an", t: "It has a first 'so...'." }, { tag: "an", t: "It has a second 'so...' that goes further (e.g. sales, market share, price)." },
      { tag: "k", t: "My disadvantage is correct (e.g. higher costs; lower profit per bag; may need a higher price; quality or supply may be less certain)." },
      { tag: "app", t: "It uses the case (10% more; 20,000₮ to 22,000₮; variable cost 37,000₮; price 65,000₮)." },
      { tag: "an", t: "It has a first 'so...'." }, { tag: "an", t: "It has a second 'so...' that goes further (e.g. contribution, profit, break-even)." }
    ],
    model: "<p><b>Advantage:</b> it improves UP's brand image [k]. The fabric is made from plastic bottles, and many people who buy hiking backpacks care about nature [app], so they may choose an 'Uul' bag and not a rival's bag [an]. This means UP's sales and market share could rise [an].</p><p><b>Disadvantage:</b> it increases UP's costs [k]. Recycled fabric costs 10% more, so the fabric for one bag rises from 20,000₮ to 22,000₮ [app]. So the variable cost rises to 37,000₮ and the contribution falls from 30,000₮ to 28,000₮ per bag [an]. This means UP makes less profit unless it raises its price of 65,000₮ [an].</p>",
    rules: ["1 mark for each correct advantage or disadvantage: 2 marks.", "Up to 3 marks for explaining each one. At least one of them must use the case.", "A list of many advantages earns no extra marks. Explain ONE fully."] },
  { id: "c8s5", type: "mcq", topic: "4.3", marks: 1, joe: true, q: "🥔 Joe says: <i>'Sustainable production always reduces profit.'</i>", opts: ["True", "False"], a: 1, explain: "False. Some methods cost more, like recycled fabric. Others save money: less waste and less electricity mean lower costs." }

{ n: 9, code: "709824", img: "finance", topic: "5.1", title: "Question 4(b)", sub: "The full 12 marks: 600,000,000₮", book: "📖 Coursebook pp. 338-358",
  terms: ["bank loan", "share issue", "retained profit", "interest"],
  steps: [
  { id: "c9s1", type: "story", chip: "Question 4(b) · 12 marks", title: "The last question", text: `<p class="q">UP needs 600,000,000₮ for its new factory. Consider the following <b>three</b> sources of finance:</p><p>• a bank loan<br>• issuing new shares<br>• retained profit</p><p class="q">Which source of finance should UP choose? Justify your answer. <b>[12]</b></p>` + APP4 + `<p>✍️ This time, you write the <b>whole</b> answer. First, three warm-ups.</p>` },
  { id: "c9s2", type: "sort", topic: "5.1", marks: 2, q: "🏠 Internal or external source of finance?", cats: ["Internal", "External"], items: [["Retained profit", 0], ["Selling old machines", 0], ["Owners' savings", 0], ["Bank loan", 1], ["Issuing shares to a new investor", 1], ["Leasing", 1]], explain: "Internal finance comes from inside the business. External finance comes from outside, and usually has a cost or a loss of control." },
  { id: "c9s3", type: "num", topic: "5.1", marks: 2, unit: "₮", q: "A bank loan of 600,000,000₮ has [[interest]] of 15% a year. Calculate the interest for one year.", formula: "Interest per year = loan × interest rate", answer: 90000000, explain: "600,000,000 × 15% = <b>90,000,000₮</b> a year, or 7,500,000₮ a month. UP's profit is about 30,000,000₮ a month." },
  { id: "c9s4", type: "num", topic: "5.1", marks: 2, unit: "months", q: "UP keeps about 20,000,000₮ of [[retained profit]] each month. How many months would it take to save 600,000,000₮?", formula: "Months = amount needed ÷ retained profit per month", answer: 30, explain: "600,000,000 ÷ 20,000,000 = <b>30 months</b>: two and a half years. The factory is too small today." },
  { id: "c9s5", type: "story", chip: "Idea menu", title: "Ideas you can use", text: `<p>📓 Pick ideas from this menu. Add numbers from Appendix 4.</p><div class="data"><div><b>🏦 Bank loan</b></div><div>✅ All the money at once. Bat and Oyun keep 100% of the shares.</div><div>⚠️ Interest of 90,000,000₮ a year, and the loan must be repaid in 5 years.</div></div><div class="data"><div><b>📜 New shares</b></div><div>✅ No interest and no repayment.</div><div>⚠️ The investor owns 30%: shared control and shared dividends for ever.</div></div><div class="data"><div><b>💰 Retained profit</b></div><div>✅ No interest. No loss of control.</div><div>⚠️ 30 months to save the money. The factory is too small now.</div></div>` },
  { id: "c9s6", type: "write", topic: "5.1", exam: true, cmd: "Justify", part: "Question 4(b)", marks: 12, q: "Consider the three sources of finance: a bank loan, issuing new shares and retained profit. Which source should UP choose? Justify your answer.", task: "Write your full answer in your notebook: three short paragraphs and a decision.",
    guide: ["Paragraph 1: source 1. One point for, one point against, with numbers.", "Paragraph 2: source 2. The same.", "Paragraph 3: source 3. The same.", "Decision: your choice, your best reason and why you rejected the others."],
    frame: ["A bank loan would ... because ... However, ...", "Issuing new shares would ... because ... However, ...", "Retained profit would ... because ... However, ...", "UP should choose ... because ...", "This is better than ... because ..."],
    levels: [[12, "Level 3: all three sources discussed with numbers from the case + a clear choice + strong justification + why the others were rejected."], [10, "Level 3: two sources discussed in detail with the case + a well-justified choice."], [8, "Level 2: two sources discussed with the case + a choice with some justification."], [6, "Level 2: one source discussed in detail with the case + a choice."], [4, "Level 1: simple points about all three sources, using the case."], [2, "Level 1: one or two simple points. No case."], [0, "Nothing correct, or nothing written."]],
    model: "<p><b>A bank loan</b> gives UP the 600,000,000₮ at once, and Bat and Oyun keep all the shares and all the control. However, interest at 15% is 90,000,000₮ a year, or 7,500,000₮ a month, and the loan must be repaid within 5 years: about 10,000,000₮ a month.</p><p><b>New shares</b> bring 600,000,000₮ with no interest and no repayment. However, the investor would own 30% of UP, so Bat and Oyun must share control and dividends for ever.</p><p><b>Retained profit</b> has no interest and no loss of control. However, UP keeps only 20,000,000₮ a month, so it would take 30 months to save the money. The factory is already too small, so UP cannot wait.</p><p><b>Decision:</b> UP should choose the bank loan. Interest and repayments are about 17,500,000₮ a month, and UP's profit is about 30,000,000₮ a month, so it can pay. The cost ends after 5 years, but selling 30% of the shares costs the owners part of the profit for ever. Retained profit is too slow. However, UP's margin of safety is only 1,000 bags, so this will only work if sales do not fall.</p>",
    rules: ["Marked by levels: Level 1 = 1-4, Level 2 = 5-8, Level 3 = 9-12.", "Level 3 needs two or more sources discussed in detail and a well-justified recommendation.", "For the top marks, explain why you rejected the other sources.", "Any source can win. The model chooses the bank loan: you may choose another.", "Be honest: mark what is in your notebook, not what is in your head."] },

  ] }

<script>
const KEY = GAME.key;
const MASTER = GAME.master;
let S = load() || fresh();
let ui = {};
let AC = null;
function tone(freqs, dur, type, vol){ if (S.mute) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const t0 = AC.currentTime; freqs.forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type || "sine"; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t0 + i * dur); g.gain.exponentialRampToValueAtTime(vol || 0.07, t0 + i * dur + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + (i + 1) * dur + 0.15); o.connect(g); g.connect(AC.destination); o.start(t0 + i * dur); o.stop(t0 + (i + 1) * dur + 0.2); }); } catch (e) {} }
const ding = () => tone([880, 1320], 0.09, "sine", 0.06), thud = () => tone([196], 0.14, "triangle", 0.05), fanfare = () => tone([523, 659, 784, 1047], 0.1, "sine", 0.05);
function fresh(){ return { name:"", val:10, ch:0, step:0, screen:"start", unlocked:{}, vars:Object.assign({}, GAME.vars0 || {}), res:{}, master:false, mute:false }; }
function load(){ try{ const t = localStorage.getItem(KEY); return t ? JSON.parse(t) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const $ = id => document.getElementById(id);
const fmt = n => { const r = Math.round(n*10)/10; return r.toLocaleString("en-US"); };
const money = n => "MNT " + Math.round(n).toLocaleString("en-US");
function val(x){ return typeof x === "function" ? x(S) : x; }
function esc(t){ return String(t).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function sub(t){ return String(t).replace(/\{B\}/g, esc(S.vars.brand || "your business")).replace(/\{N\}/g, esc(S.name || GAME.roleName || "Founder")); }
function gl(html){
  return sub(html).replace(/\[\[([^\]]+)\]\]/g, (m, w) => {
    const [term, label] = w.split("|");
    const k = Object.keys(GLOSSARY).find(g => g.toLowerCase() === term.toLowerCase());
    return k ? `<span class="term" data-act="term" data-term="${k}">${label || term}</span>` : (label || term);
  }).replace(/\[(k|app|an|eval)\]/g, (m, t) => `<span class="tag ${t}">${t}</span>`);
}
function rng(seed){ let h = 2166136261; for (const c of seed) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; }; }
function shuffled(arr, seed){ const r = rng(seed); const idx = arr.map((_, i) => i); for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; } return idx; }
function parseNum(t){ if (t == null) return NaN; t = String(t).trim().toLowerCase().replace(/₮|tugrik|tögrög|mnt|packs?|points?|units?|hoodies?|cups?|bags?|bottles?|people|students?|customers?|workers?|,|%|\s/g, ""); let mult = 1; if (/(billion|bn)$/.test(t)) { mult = 1e9; t = t.replace(/(billion|bn)$/, ""); } else if (/(million|m)$/.test(t)) { mult = 1e6; t = t.replace(/(million|m)$/, ""); } return parseFloat(t) * mult; }
function close(x, ans){ if (isNaN(x)) return false; const tol = Math.max(Math.abs(ans) * 0.005, 0.01); return [1, 1e6, 1e9].some(k => Math.abs(x * k - ans) <= tol); }

function ch(){ return CHAPTERS[S.ch]; }
function step(){ return ch().steps[S.step]; }
function addVal(d){ S.val = Math.round((S.val + d) * 10) / 10; }
function record(st, earned, extra){ S.res[st.id] = Object.assign({ done:true, earned, max: st.marks || 0, topic: st.topic, ch: S.ch }, extra || {}); addVal(earned); save(); render(); }

function header(){

function chips(st){

  return `<div class="card cert"><div class="chips" style="justify-content:center"><span class="chip story">${GAME.reportName || "Founder's Report"}</span></div><div class="name">${esc(S.name || GAME.roleName || "Founder")}</div><p class="small">${GAME.reportSub} · ${esc(S.vars.brand || "")}</p><div class="scorebig">${fmt(tot)} / ${max}</div><p><b>Total score</b> · ${Math.round(tot / max * 100)}%</p><p>📝 Exam parts: <b>${fmt(x.xe)} of ${x.xm}</b> marks · ✔️ Quick checks: <b>${fmt(x.e)} of ${x.m}</b> points</p><p>${GAME.valIcon || "🥟"} ${GAME.valName || "Brand value"} <span class="earn">${fmt(v)}${GAME.valLong === undefined ? " million ₮" : GAME.valLong}</span> · ${title}</p><p class="small">📱 Show this screen to Mr. Chris.</p></div>
<div class="card"><h2>Your revision map</h2><table class="map">${rows}</table><p style="margin-top:10px">${weak.length ? `🎯 <b>Revise first:</b> ${weak.join(", ")}. Reread these topics in your coursebook tonight.` : "🎯 Strong on every topic. Next step: full past Paper 1 and Paper 2 questions."}</p></div>
<div class="card"><h2>Your path</h2><ul class="path">${path}</ul><p class="small">${GAME.pathNote || "Different choices lead to different numbers and endings. Play again later to try another path."}</p><div class="row"><button class="btn ghost" data-act="reset">Play again</button></div></div>`;
}
function showMenu(){
  const cr = Object.values(CREDITS).filter((x, i, a) => a.indexOf(x) === i).map(x => `<li>${x}</li>`).join("");
  $("pop").innerHTML = `<div class="pop"><b>Menu</b><p class="small">Progress is saved on this device.</p><div class="row"><button class="btn teal" data-act="myscore">📱 Show my score now</button></div><div class="row"><button class="btn ghost" data-act="reset">Start again</button><button class="btn" data-act="popclose">Close</button></div><p class="small" style="margin-top:10px"><b>Photo credits</b></p><ul class="small">${cr}</ul><p class="small">All businesses, people and figures in the story are fictional.</p></div>`;
}
function showCase(){ $("pop").innerHTML = `<div class="pop case"><div class="row" style="justify-content:space-between;align-items:center;margin:0"><b>📄 ${GAME.caseTitle || "Case study"}</b><button class="btn" data-act="popclose">Close ✕</button></div>${gl(val(GAME.caseFile))}<div class="row"><button class="btn" data-act="popclose">Close ✕</button></div></div>`; }
function showScore(){ const x = totals(); $("pop").innerHTML = `<div class="pop" style="text-align:center"><b>${esc(S.name || GAME.roleName || "Founder")}</b> · ${esc(S.vars.brand || "")}<div class="scorebig" style="margin:8px 0">${fmt(x.xe + x.e)} / ${x.xm + x.m}</div><p class="small">Score so far · reached ${GAME.chapterWord || "Chapter"} ${S.ch + 1} of ${CHAPTERS.length}<br>Exam parts ${fmt(x.xe)} of ${x.xm} · Quick checks ${fmt(x.e)} of ${x.m}</p><div class="row" style="justify-content:center"><button class="btn" data-act="popclose">Close</button></div></div>`; }

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b) { if (!ev.target.closest(".pop")) $("pop").innerHTML = ""; return; }
  const a = b.dataset.act, st = (S.screen === "play") ? step() : null;
  if (a === "term") { const k = b.dataset.term; $("pop").innerHTML = `<div class="pop"><b>${k}</b><br>${GLOSSARY[k]}</div>`; ev.stopPropagation(); return; }
  if (a === "menu") return showMenu();
  if (a === "myscore") return showScore();
  if (a === "case") return showCase();
  if (a === "mute") { S.mute = !S.mute; save(); return header(); }
  if (a === "key") {
    const k = b.dataset.k; ui.code = ui.code || ""; ui.codeErr = false;
    if (k === "⌫") ui.code = ui.code.slice(0, -1);
    else if (k === "✓") {
      if (ui.code === MASTER) S.master = true;
      if (ui.code === ch().code || ui.code === MASTER) { S.unlocked[S.ch] = true; S.screen = "play"; S.step = 0; ui = {}; save(); fanfare(); return render(); }
      ui.codeErr = true; ui.code = ""; thud();
    } else if (ui.code.length < 6) ui.code += k;
    return render();
  }
  if (a === "popclose") { $("pop").innerHTML = ""; return; }
  if (a === "reset") {
    if (!ui.confirmReset) { ui.confirmReset = true; b.textContent = "Tap again to erase my progress"; return; }
    S = fresh(); ui = {}; save(); $("pop").innerHTML = ""; return render();
  }
  if (a === "startgo") { S.name = ($("nm").value || "").trim().slice(0, 24); S.screen = "gate"; S.ch = 0; save(); return render(); }
  if (a === "code") {
    const v = ($("code").value || "").trim().toUpperCase();
    if (v === MASTER) S.master = true;
    if (v === ch().code || v === MASTER) { S.unlocked[S.ch] = true; S.screen = "play"; S.step = 0; ui = {}; save(); return render(); }
    ui.codeErr = true; return render();
  }
  if (a === "next") { ui = {}; let n = S.step + 1; while (n < ch().steps.length && ch().steps[n].show && !ch().steps[n].show(S)) n++; if (n < ch().steps.length) S.step = n; else S.screen = "end"; save(); return render(); }
  if (a === "tonext") {
    ui = {};
    if (S.ch === CHAPTERS.length - 1) { S.screen = "report"; save(); return render(); }
    S.ch++; S.step = 0; S.screen = (S.master || S.unlocked[S.ch]) ? "play" : "gate"; save(); return render();
  }
  if (a === "flip") { ui.flip = ui.flip || {}; ui.flip[b.dataset.i] = !ui.flip[b.dataset.i]; return render(); }
  if (!st) return;
  if (a === "choose" && !S.res[st.id]) {
    const i = +b.dataset.i, o = st.opts[i];
    if (o.lock && o.lock(S)) return;
    Object.assign(S.vars, o.set || {});
    const d = o.valFn ? o.valFn(S) : o.val;
    const after = st.after ? st.after(S) : "";
    S.res[st.id] = { done: true, pick: i, delta: d, after, ch: S.ch, max: 0, earned: 0 };
    addVal(d); save(); return render();
  }
  if (a === "mcq") {
    const i = +b.dataset.i; ui.tries = ui.tries || [];
    if (ui.tries.includes(i)) return;
    ui.tries.push(i);
    if (i === st.a) { ding(); return record(st, ui.tries.length === 1 ? st.marks : st.marks / 2, { tries: ui.tries }); }
    thud();
    if (ui.tries.length >= 2 || val(st.opts).length === 2) return record(st, 0, { tries: ui.tries });
    return render();
  }
  if (a === "sortpick") { ui.pick = ui.pick || {}; ui.pick[b.dataset.i] = +b.dataset.c; return render(); }
  if (a === "sortcheck") {
    const right = st.items.filter((it, i) => ui.pick[i] === it[1]).length;
    (right === st.items.length ? ding : right ? () => {} : thud)();
    return record(st, Math.round(st.marks * right / st.items.length * 2) / 2, { pick: ui.pick, right });
  }
  if (a === "numcheck") {
    const raw = $("ans").value; const x = parseNum(raw); ui.tries = ui.tries || [];
    if (raw.trim() === "") return;
    ui.tries.push(raw);
    if (close(x, val(st.answer))) { ding(); return record(st, ui.tries.length === 1 ? st.marks : st.marks / 2, { tries: ui.tries }); }
    thud();
    if (ui.tries.length >= 2) return record(st, 0, { tries: ui.tries });
    return render();
  }
  if (a === "buildpick") { ui.pick = ui.pick || {}; ui.pick[b.dataset.s] = +b.dataset.o; return render(); }
  if (a === "buildcheck") { const sl = val(st.slots); const right = sl.filter((_, i) => ui.pick[i] === 0).length; (right === sl.length ? ding : () => {})(); return record(st, right * st.marks / sl.length, { pick: ui.pick, right }); }
  if (a === "orderpick") { ui.seq = ui.seq || []; ui.seq.push(+b.dataset.i); return render(); }
  if (a === "orderundo") { ui.seq.pop(); return render(); }
  if (a === "ordercheck") { const right = ui.seq.filter((x, p) => x === p).length; if (right === st.items.length) ding(); return record(st, Math.round(st.marks * right / st.items.length * 2) / 2, { seq: ui.seq, right }); }
  if (a === "stmtcheck") {
    const rows = val(st.rows); const ans = {}, ok = {}; let n = 0, right = 0;
    document.querySelectorAll("input[data-row]").forEach(inp => {
      const i = +inp.dataset.row; ans[i] = inp.value; n++;
      const x = parseNum(inp.value), want = Math.abs(rows[i][2]);
      ok[i] = !isNaN(x) && Math.abs(Math.abs(x) - want) <= 0.051; if (ok[i]) right++;
    });
    return record(st, Math.round(st.marks * right / n * 2) / 2, { ans, ok, right, n });
  }
  if (a === "nbreveal") { ui.reveal = true; return render(); }
  if (a === "nbpick") { ui.nb = +b.dataset.n; return render(); }
  if (a === "nbsave") return record(st, ui.nb, {});
  if (a === "lvl") { ui.lvl = +b.dataset.i; return render(); }
  if (a === "tick") { ui.ticks = ui.ticks || {}; ui.ticks[b.dataset.i] = b.checked; return render(); }
  if (a === "wsave") { const m = st.levels ? st.levels[ui.lvl][0] : st.points.filter((_, i) => (ui.ticks || {})[i]).length; return record(st, m, st.levels ? { lvl: ui.lvl } : { ticks: ui.ticks || {} }); }
});
document.addEventListener("keydown", e => { if (S.screen === "gate" && /^[0-9]$|^Backspace$|^Enter$/.test(e.key)) { const k = e.key === "Backspace" ? "⌫" : e.key === "Enter" ? "✓" : e.key; const btn = document.querySelector(`[data-act="key"][data-k="${k}"]`); if (btn) btn.click(); return; } if (e.key === "Enter") { const c = document.querySelector('[data-act="numcheck"]'); if (c && document.activeElement && document.activeElement.tagName === "INPUT") c.click(); } });
render();
</script>
